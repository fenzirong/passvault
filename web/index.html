<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="本地加密的密码保险库，支持 2FA、密码生成与局域网同步" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="密码保险库" />
    <title>密码保险库</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 图标精灵 -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" /><path d="m15 15 6 6" /><path d="m4 4 5 5" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" /><circle cx="15" cy="6" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="17" cy="18" r="2" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 7.5-2" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18" /><path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2" /><path d="M6.2 6.2A17 17 0 0 0 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.3-.9" /><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" /></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16v4Z" /><path d="m14 6 4 4" /></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z" /><path d="m9 12 2 2 4-4" /></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" /><path d="m11 12 9-9M17 6l2 2M14 9l2 2" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z" /><path d="M14 3v5h5M9 13h6M9 17h6" /></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 13l5-5 5 5M5 4h14" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z" /></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z" /><path d="M12 9v5M12 17.5v.5" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" /><circle cx="12" cy="13" r="3.5" /></symbol>
      <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><path d="M14 14h3v3h-3zM20 14h1M14 20h3M20 19v2" /></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0" /><circle cx="12" cy="19" r="1" /></symbol>
    </svg>

    <div class="app">
      <!-- ============ 锁屏 / 创建保险库 ============ -->
      <section id="lock" class="lock">
        <div class="lock-card">
          <div class="brand">
            <div class="brand-logo"><svg><use href="#i-shield" /></svg></div>
            <div>
              <h1>密码保险库</h1>
              <p id="lock-sub">输入主密码解锁</p>
            </div>
          </div>

          <form id="lock-form" autocomplete="off">
            <label class="field">
              <span class="field-label">主密码</span>
              <div class="input-wrap">
                <input id="master-password" type="password" placeholder="请输入主密码" autocomplete="current-password" required />
                <button type="button" class="icon-btn inside" id="toggle-pw" title="显示密码"><svg><use href="#i-eye" /></svg></button>
              </div>
            </label>

            <label class="field" id="confirm-wrap" hidden>
              <span class="field-label">确认主密码</span>
              <div class="input-wrap">
                <input id="master-password2" type="password" placeholder="再次输入主密码" autocomplete="new-password" />
              </div>
            </label>

            <div class="strength" id="pw-strength" hidden>
              <div class="strength-bar"><i></i></div>
              <span class="strength-text">—</span>
            </div>

            <p class="lock-error" id="lock-error" hidden></p>
            <button class="btn primary block" id="lock-submit" type="submit">解锁</button>
          </form>

          <div class="lock-links">
            <button class="link" id="restore-btn" type="button">从备份文件恢复</button>
            <button class="link" id="theme-btn" type="button">切换主题</button>
          </div>
          <p class="lock-note">
            <svg><use href="#i-lock" /></svg>
            数据仅保存在本机，使用 PBKDF2 + AES-256-GCM 加密
          </p>
        </div>
      </section>

      <!-- ============ 主界面 ============ -->
      <div id="main" class="main" hidden>
        <header class="topbar">
          <button class="icon-btn only-mobile" id="menu-btn" title="条目列表"><svg><use href="#i-menu" /></svg></button>
          <div class="search">
            <svg class="search-icon"><use href="#i-search" /></svg>
            <input id="search" type="search" placeholder="搜索名称、账号、网址…" autocomplete="off" />
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="gen-btn" title="密码生成器"><svg><use href="#i-shuffle" /></svg></button>
            <button class="icon-btn" id="sync-btn" title="局域网同步"><svg><use href="#i-refresh" /></svg></button>
            <button class="icon-btn" id="settings-btn" title="设置"><svg><use href="#i-sliders" /></svg></button>
            <button class="icon-btn" id="lock-btn" title="锁定保险库"><svg><use href="#i-lock" /></svg></button>
          </div>
        </header>

        <div class="body">
          <aside class="sidebar" id="sidebar">
            <div class="filters" id="filters"></div>
            <div class="list" id="entry-list"></div>
            <button class="fab" id="add-btn"><svg><use href="#i-plus" /></svg><span>新建条目</span></button>
          </aside>
          <main class="detail" id="detail"></main>
        </div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toasts"></div>

    <script src="vendor/jsQR.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
